<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to Nova</title><link rel="stylesheet" href="src/account.css"></head><body><a class="account-brand" href="account.html" aria-label="Nova"><img src="Nova12.png" alt="Nova"><span>NOVA</span></a><main class="account-shell"><section class="account-panel"><div id="account-content" aria-live="polite"><p class="eyebrow">YOUR NEXT CHAPTER</p><h1>Welcome home.</h1><p class="intro">Your games. Your people. Your own little universe.</p><div class="account-tabs"><button id="login-tab" class="active">Log in</button><button id="signup-tab">Create account</button></div><form id="account-form"><label id="name-label" hidden>Username<input id="account-name" autocomplete="nickname" minlength="2" maxlength="24"></label><label>Email<input id="account-email" type="email" autocomplete="email" required></label><label>Password<div class="password-row"><input id="account-password" type="password" autocomplete="current-password" required minlength="8"><button id="show-password" type="button" aria-label="Show password">Show</button></div></label><button id="reset-password" class="text-button" type="button">Forgot password?</button><p id="account-error" role="alert"></p><button class="primary" id="account-submit">Log in <span>↗</span></button></form><p class="account-note">One account. A space that feels like you.</p></div><p class="footer-note">NOVA · PLAY YOUR WAY</p></section><section class="showcase" aria-label="A moving collection of Nova games and apps"><div class="cover-scene" aria-hidden="true" id="cover-scene"></div><div class="showcase-caption"><span class="live-dot"></span><span>SO MUCH TO EXPLORE</span><h2>A whole world.<br>With your name on it.</h2><p>Find your next favorite. Make yourself at home.</p></div><button id="pause-showcase" aria-label="Pause moving covers">Pause motion</button></section></main><script type="module" src="src/account.js"></script></body></html>
