<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Chat</title><link rel="stylesheet" href="src/chat-v2.css"><link rel="stylesheet" href="src/chat-midnight.css"></head><body>
<div id="loading" class="loading"><img src="Nova12.png" alt="Nova"><h1>Nova Chat</h1><p id="load-label">Connecting your account…</p><progress id="load-progress" max="5" value="0" aria-label="Chat loading"></progress><button id="retry" hidden onclick="location.reload()">Try again</button></div>
<div class="chat-shell"><aside class="server-rail"><button id="home-button" class="server active" title="Direct messages" aria-label="Direct messages"><svg viewBox="0 0 24 24" aria-hidden="true" class="dm-home-icon"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H9l-6 4v-5a3 3 0 0 1-1-2V7a3 3 0 0 1 3-3Z"/><path d="M7 9h10M7 13h7"/></svg></button><hr><button id="nova-server" class="server" title="Nova server">N<span class="server-dot"></span></button><button id="back-home" class="rail-bottom" title="Back to Nova">↗</button></aside>
<aside class="sidebar"><div class="sidebar-heading" id="sidebar-heading">Your space to connect</div><div id="side-nav"></div><div class="side-label">DIRECT MESSAGES</div><div id="dm-list" class="dm-list"></div><div id="self" class="self"></div></aside>
<main><header class="topbar"><div id="title">Friends</div><div class="header-actions"><span id="connection">Connecting</span><img src="Nova12.png" alt="Nova" width="28" height="28"></div></header><div id="view"></div></main></div><div id="toast" role="status"></div><script type="module" src="src/chat-v2.js"></script><script type="module" src="src/owner-window.js"></script><script type="module" src="src/control-runtime.js"></script></body></html>
