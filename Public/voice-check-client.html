<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="voice-chat.css"><style>body{background:#13151c;color:white;font-family:system-ui;margin:0}.chat-shell{height:100vh}main{height:100%}.nova-voice{padding:12px}.voice-heading,.voice-room-summary,.voice-members{display:none}.voice-videos{margin:8px}.voice-controls{margin:8px}.voice-status{font-size:12px}</style><div id="side-nav" hidden></div><div class="chat-shell"><main><div class="header-actions"></div><div id="view"></div></main></div><script type="module">
if(!['localhost','127.0.0.1'].includes(location.hostname)||parent===window)throw Error('Local test only');
const {mountVoice}=await import('./voice-chat.js');const uid=new URLSearchParams(location.search).get('id');const ctx=new AudioContext();const destination=ctx.createMediaStreamDestination();const source=ctx.createOscillator();const gain=ctx.createGain();gain.gain.value=0;source.connect(gain).connect(destination);source.start();
function video(color){const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const c=canvas.getContext('2d');c.fillStyle=color;c.fillRect(0,0,640,360);c.fillStyle='white';c.font='32px system-ui';c.fillText(uid+' '+color,30,100);const stream=canvas.captureStream(15);const timer=setInterval(()=>{c.fillStyle=color;c.fillRect(0,150,640,100);c.fillStyle='white';c.fillText(String(Date.now()),30,200);},200);stream.getVideoTracks()[0].addEventListener('ended',()=>clearInterval(timer));return stream;}
const state={page:'voice',server:true,peer:null};const controller=mountVoice({state,person:()=>({name:uid}),toast:()=>{},identity:async()=>({uid}),request:b=>parent.voiceBroker(uid,b),mediaDevices:{getUserMedia:async options=>options.audio?destination.stream:video('teal'),getDisplayMedia:async()=>video('purple')},enter:()=>{state.page='voice';}});window.testVoice={stats:()=>controller.stats(),join:()=>{ctx.resume();window.novaJoinServerVoice();},camera:()=>document.querySelector('[data-camera]').click(),share:()=>document.querySelector('[data-share]').click(),leave:()=>{document.querySelector('[data-leave]').click();ctx.close();}};
</script>
