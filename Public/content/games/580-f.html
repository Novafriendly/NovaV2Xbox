<!DOCTYPE html>
<html lang="en-us">
  <head><script id="nova-analytics-compat">window.dataLayer=window.dataLayer||[];window.gtag=window.gtag||function(){};</script>
    <base href="https://cdn.jsdelivr.net/gh/bubblfan/cg-rip@main/traffic-rider/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
#sidebarad1,
#sidebarad2 {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 160px;
  height: 600px;
  padding: 0;
  margin: 0;
  z-index: 999999;
}
#sidebarad1 {
  left: 0;
}
#sidebarad2 {
  right: 0;
}
.sidebar-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}
.sidebar-frame {
  width: 160px;
  height: 600px;
  border: none;
  display: block;
}
</style>
</head>
  <body style="margin:0;padding:0" class="noselect">
    <div id="loading-text" style="position:fixed;inset:0;z-index:2;background:#090c12;color:white;pointer-events:none;font-size:24px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="unity-canvas"
      style="position:fixed;top:0;left:0;width:100%;height:100%;outline:none"></canvas>

    <script>
    const SPLIT_MAP = {"y8.wasm": 2, "y8.data": 3};
    </script>

    <script>
    async function mergeParts(baseUrl, count) {
      const buffers = new Array(count);
      let next = 0;
      async function download() {
        while (next < count) {
          const index = next++, url = new URL(baseUrl + '.part' + (index + 1), document.baseURI).href;
          for (let attempt = 0; ; attempt++) {
            try {
              const response = await fetch(url);
              if (!response.ok) throw new Error('Game file download failed: ' + response.status);
              const bytes = new Uint8Array(await response.arrayBuffer());
              if (!bytes.length) throw new Error('Empty game file');
              buffers[index] = bytes;
              break;
            } catch (error) {
              if (attempt >= 2) throw error;
              await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
            }
          }
        }
      }
      await Promise.all([download(), download()]);
      return URL.createObjectURL(new Blob(buffers, {type:baseUrl.endsWith('.wasm')?'application/wasm':'application/octet-stream'}));
    }

    async function preMergeAll() {
      const map = {};
      const files = Object.entries(SPLIT_MAP);
      const total = files.length;
      let done = 0;

      const loadingText = document.getElementById("loading-text");

      for (const [file, count] of files) {
        const merged = await mergeParts("Build/" + file, count);
        map[file] = merged;
        done++;
        const percent = Math.floor((done / total) * 100);
        loadingText.innerText = `LOADING... ${percent}%`;
        console.log("Premerged:", file, "→", merged);
      }

      loadingText.textContent = "Starting engine…";

      return map;
    }

    (async () => {
      const mergedMap = await preMergeAll();
      window.SPLIT_MAP = mergedMap;
      const origFetch = window.fetch;
      window.fetch = async function(resource, options) {
        if (typeof resource === "string") {
          const key = resource.split("/").pop();
          if (mergedMap[key]) {
            console.log("Redirect fetch:", key);
            return origFetch(mergedMap[key], options);
          }
          if (resource.includes("StreamingAssets")) {
            return origFetch((document.querySelector('base').href !== null ? document.querySelector('base').href+"/" : "") + "StreamingAssets/"+resource.split("/StreamingAssets/")[1])
          }
        }
        return origFetch(resource, options);
      };

      const OrigXHR = window.XMLHttpRequest;
      window.XMLHttpRequest = function() {
        const xhr = new OrigXHR();
        const origOpen = xhr.open;
        xhr.open = function(method, url, ...rest) {
          const key = url.split("/").pop();
          if (mergedMap[key]) {
            console.log("Redirect XHR:", key);
            origOpen.call(xhr, method, mergedMap[key], ...rest);
          } else {
            origOpen.call(xhr, method, url, ...rest);
          }
        };
        return xhr;
      };

      const canvas = document.querySelector("#unity-canvas");
      const loaderUrl = "Build/y8.loader.js";
      const config = {
        dataUrl: "Build/y8.data",
        frameworkUrl: "Build/y8.framework.js",
        codeUrl: "Build/y8.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Traffic Rider",
        productName: "Traffic Rider",
        productVersion: "1.0.0"
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {document.getElementById("loading-text").textContent="Starting engine… "+Math.round(progress*100)+"%";}).then((unityInstance) => {
          document.getElementById("loading-text").hidden=true;
          window.gameInstance = unityInstance;
        }).catch((message) => alert(message));
      };
      script.onerror = () => {document.getElementById('loading-text').textContent='The game engine could not download. Reload to try again.';};
      document.body.appendChild(script);
    })().catch(error => {document.getElementById('loading-text').textContent='Could not download Traffic Rider. Reload to retry. '+error.message;});
    </script>

    <script>
    function resizeCanvas() {
      const canvas = document.getElementById("unity-canvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    window.addEventListener("load", resizeCanvas);
    window.addEventListener("resize", resizeCanvas);
    </script>
  <div id="sidebarad1">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
<div id="sidebarad2">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
</body>
</html>
