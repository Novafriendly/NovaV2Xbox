<!doctype html><meta charset="utf-8"><title>Nova Voice local verification</title><style>body{background:#11141b;color:white;font:15px system-ui;padding:24px}iframe{width:48%;height:480px;border:1px solid #454955}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Nova Voice — local verification</h1><p>Two synthetic clients. No microphone, camera, account changes or server writes.</p><button id="run">Run verification</button><pre id="result">Ready</pre><div id="clients"></div><script type="module">
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Local verification only');
const rooms={};window.voiceBroker=async(uid,b)=>{if(b.action==='invites')return {invites:[]};if(b.action==='lobby')return {rooms:Object.fromEntries(['server-vc-1','server-vc-2'].map(id=>[id,{members:rooms[id]?.members||{},capacity:6}]))};const r=rooms[b.room]??={members:{},signals:{}};if(b.action==='join'){r.members[b.session]={name:uid,account:uid};return {iceServers:[],relayConfigured:false};}if(b.action==='poll'){Object.assign(r.members[b.session],{muted:b.muted,camera:b.camera,screen:b.screen});const q=r.signals[b.session]||{};for(const id of b.ack||[])delete q[id];return {members:structuredClone(r.members),signals:Object.values(q)};}if(b.action==='signal'){const id=crypto.randomUUID();(r.signals[b.to]??={})[id]={id,from:b.session,signal:b.signal};return {ok:true};}if(b.action==='leave'){delete r.members[b.session];delete r.signals[b.session];return {ok:true};}throw Error('Unexpected test request');};
const frames=['Alice','Bob'].map(id=>{const f=document.createElement('iframe');f.src='voice-check-client.html?id='+id;document.querySelector('#clients').append(f);return f;});
const wait=async(check,seconds=25)=>{const start=Date.now();while(!check()){if(Date.now()-start>seconds*1000)throw Error('Timed out waiting for media');await new Promise(r=>setTimeout(r,200));}};
document.querySelector('#run').onclick=async()=>{const result=document.querySelector('#result');result.textContent='Starting…';try{await wait(()=>frames.every(f=>f.contentWindow.testVoice));frames.forEach(f=>f.contentWindow.testVoice.join());await wait(()=>frames.every(f=>f.contentDocument.querySelector('[data-state]').textContent==='Connected'));const stats=await Promise.all(frames.map(f=>f.contentWindow.testVoice.stats()));if(!stats.every(rows=>rows.some(s=>s.audioPackets>0)))throw Error('Connected but no inbound microphone packets');result.textContent='PASS: two WebRTC peers received microphone packets.\n';const a=frames[0].contentWindow.testVoice;a.camera();await wait(()=>frames[1].contentDocument.querySelector('[data-videos] video')?.videoWidth>0);result.textContent+='PASS: camera video received and decoded.\n';a.share();await wait(()=>frames[1].contentDocument.querySelector('.voice-screen video')?.videoWidth>0);result.textContent+='PASS: separate screen-share video received while camera remains live.\n';a.share();await wait(()=>frames[1].contentDocument.querySelector('.voice-screen')?.hidden);result.textContent+='PASS: stopping screen share preserves microphone and camera.\n';frames.forEach(f=>f.contentWindow.testVoice.leave());await wait(()=>Object.values(rooms).every(r=>!Object.keys(r.members).length));result.textContent+='PASS: both clients left and cleaned up room membership.\n';}catch(e){result.textContent+='FAIL: '+e.message;frames.forEach(f=>f.contentWindow.testVoice?.leave());}};
</script>
